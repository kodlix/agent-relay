# Demo-grade credentials matching compose.yaml, kept in one Secret so
# Postgres's own env vars and the API's connection string never drift apart.
# For a real deployment, generate these out-of-band (e.g. a sealed secret or
# your cluster's secret manager) instead of committing them.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: agent-relay
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: agent_relay
  RELAY_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/agent_relay
