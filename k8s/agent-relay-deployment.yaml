apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-relay
  namespace: agent-relay
spec:
  # Two replicas behind one Service: this is the scenario the PostgreSQL
  # row-locking port (storage.py's `FOR UPDATE SKIP LOCKED`) exists for --
  # concurrent claims from different API pods must never double-claim a task.
  replicas: 2
  selector:
    matchLabels:
      app: agent-relay
  template:
    metadata:
      labels:
        app: agent-relay
    spec:
      containers:
        - name: agent-relay
          image: agent-relay:local
          # Loaded directly into kind's node via `kind load docker-image`;
          # there is no registry to pull it from.
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: RELAY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: RELAY_DATABASE_URL
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
